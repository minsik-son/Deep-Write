name: TranslatorKeyboard
options:
  bundleIdPrefix: com.translatorkeyboard
  deploymentTarget:
    iOS: "17.0"
  xcodeVersion: "16.0"
  generateEmptyDirectories: true
  defaultConfig: Release
  knownRegions:
    - en
    - ko
    - ja
    - zh-Hans
    - es
    - fr
    - de
    - it
    - ru
    - Base

settings:
  base:
    SWIFT_VERSION: "5.9"
    IPHONEOS_DEPLOYMENT_TARGET: "17.0"
    DEVELOPMENT_TEAM: 3Q2D38NW4X
    CODE_SIGN_STYLE: Automatic

packages:
  GoogleMobileAds:
    url: https://github.com/googleads/swift-package-manager-google-mobile-ads.git
    from: "13.2.0"
  UserMessagingPlatform:
    url: https://github.com/googleads/swift-package-manager-google-user-messaging-platform.git
    from: "3.1.0"

schemes:
  TranslatorKeyboard:
    build:
      targets:
        TranslatorKeyboard: all
        KeyboardExtension: all
    run:
      config: Debug
      storeKitConfiguration: TranslatorKeyboard/Paywall/Products.storekit
    test:
      config: Debug
    profile:
      config: Release
    analyze:
      config: Debug
    archive:
      config: Release
  KeyboardExtension:
    build:
      targets:
        KeyboardExtension: all
        TranslatorKeyboard: all
    run:
      config: Debug
      askForAppToLaunch: true

targets:
  TranslatorKeyboard:
    type: application
    platform: iOS
    sources:
      - path: TranslatorKeyboard
        excludes:
          - "Resources/Info.plist"
      - path: KeyboardExtension/Logic/SavedPhrasesManager.swift
      - path: KeyboardExtension/Theme/Core/KeyboardTheme.swift
      - path: KeyboardExtension/Theme/Core/ThemePatternRenderer.swift
      - path: Shared
    info:
      path: TranslatorKeyboard/Resources/Info.plist
      properties:
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
          UISceneConfigurations:
            UIWindowSceneSessionRoleApplication:
              - UISceneConfigurationName: Default Configuration
                UISceneDelegateClassName: $(PRODUCT_MODULE_NAME).SceneDelegate
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        CFBundleDisplayName: OneBoard
        UILaunchScreen: {}
        GADApplicationIdentifier: $(ADMOB_APP_ID)
        NSUserTrackingUsageDescription: OneBoard uses this identifier to make rewarded ads more relevant and to support free correction and translation credits.
        NSSpeechRecognitionUsageDescription: Speech recognition is used to convert your voice into text while dictation is active.
        NSMicrophoneUsageDescription: Microphone access is used to capture your voice for dictation.
        CFBundleURLTypes:
          - CFBundleURLName: com.translatorkeyboard.app
            CFBundleURLSchemes:
              - translatorkeyboard
        SKAdNetworkItems:
          - SKAdNetworkIdentifier: cstr6suwn9.skadnetwork
          - SKAdNetworkIdentifier: 4fzdc2evr5.skadnetwork
          - SKAdNetworkIdentifier: 2fnua5tdw4.skadnetwork
          - SKAdNetworkIdentifier: ydx93a7ass.skadnetwork
          - SKAdNetworkIdentifier: p78axxw29g.skadnetwork
          - SKAdNetworkIdentifier: v72qych5uu.skadnetwork

name: TranslatorKeyboard
options:
  bundleIdPrefix: com.translatorkeyboard
  deploymentTarget:
    iOS: "17.0"
  xcodeVersion: "16.0"
  generateEmptyDirectories: true
  defaultConfig: Release
  knownRegions:
    - en
    - ko
    - ja
    - zh-Hans
    - es
    - fr
    - de
    - it
    - ru
    - Base

settings:
  base:
    SWIFT_VERSION: "5.9"
    IPHONEOS_DEPLOYMENT_TARGET: "17.0"
    DEVELOPMENT_TEAM: 3Q2D38NW4X
    CODE_SIGN_STYLE: Automatic

packages:
  GoogleMobileAds:
    url: https://github.com/googleads/swift-package-manager-google-mobile-ads.git
    from: "13.2.0"
  UserMessagingPlatform:
    url: https://github.com/googleads/swift-package-manager-google-user-messaging-platform.git
    from: "3.1.0"

schemes:
  TranslatorKeyboard:
    build:
      targets:
        TranslatorKeyboard: all
        KeyboardExtension: all
    run:
      config: Debug
      storeKitConfiguration: TranslatorKeyboard/Paywall/Products.storekit
    test:
      config: Debug
    profile:
      config: Release
    analyze:
      config: Debug
    archive:
      config: Release
  KeyboardExtension:
    build:
      targets:
        KeyboardExtension: all
        TranslatorKeyboard: all
    run:
      config: Debug
      askForAppToLaunch: true

targets:
  TranslatorKeyboard:
    type: application
    platform: iOS
    sources:
      - path: TranslatorKeyboard
        excludes:
          - "Resources/Info.plist"
      - path: KeyboardExtension/Logic/SavedPhrasesManager.swift
      - path: KeyboardExtension/Theme/Core/KeyboardTheme.swift
      - path: KeyboardExtension/Theme/Core/ThemePatternRenderer.swift
      - path: Shared
    info:
      path: TranslatorKeyboard/Resources/Info.plist
      properties:
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
          UISceneConfigurations:
            UIWindowSceneSessionRoleApplication:
              - UISceneConfigurationName: Default Configuration
                UISceneDelegateClassName: $(PRODUCT_MODULE_NAME).SceneDelegate
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        CFBundleDisplayName: OneBoard
        UILaunchScreen: {}
        GADApplicationIdentifier: $(ADMOB_APP_ID)
        NSUserTrackingUsageDescription: This identifier will be used to deliver personalized ads to you.
        NSSpeechRecognitionUsageDescription: Speech recognition is used to convert your voice into text while dictation is active.
        NSMicrophoneUsageDescription: Microphone access is used to capture your voice for dictation.
        CFBundleURLTypes:
          - CFBundleURLName: com.translatorkeyboard.app
            CFBundleURLSchemes:
              - translatorkeyboard
        SKAdNetworkItems:
          - SKAdNetworkIdentifier: cstr6suwn9.skadnetwork
        UIBackgroundModes:
          - audio
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.translatorkeyboard.app
        INFOPLIST_FILE: TranslatorKeyboard/Resources/Info.plist
        CODE_SIGN_ENTITLEMENTS: TranslatorKeyboard/TranslatorKeyboard.entitlements
        DEVELOPMENT_TEAM: 3Q2D38NW4X
        ADMOB_APP_ID: ca-app-pub-9921649727270589~7890214484
        TARGETED_DEVICE_FAMILY: "1"
    entitlements:
      path: TranslatorKeyboard/TranslatorKeyboard.entitlements
      properties:
        com.apple.security.application-groups:
          - group.com.translatorkeyboard.shared
        keychain-access-groups:
          - $(AppIdentifierPrefix)group.com.translatorkeyboard.shared
    dependencies:
      - target: KeyboardExtension
      - package: GoogleMobileAds
      - package: UserMessagingPlatform
        product: GoogleUserMessagingPlatform

  KeyboardExtension:
    type: app-extension
    platform: iOS
    sources:
      - path: KeyboardExtension
        excludes:
          - "Resources/Info.plist"
          - "Logic/Array+Safe.swift"
          - "CalculatorView.swift"
      - path: Shared
    resources:
      - path: KeyboardExtension/Resources/ngram_en.json
      - path: KeyboardExtension/Resources/ngram_ko.json
    info:
      path: KeyboardExtension/Resources/Info.plist
      properties:
        NSExtension:
          NSExtensionAttributes:
            IsASCIICapable: false
            PrefersRightToLeft: false
            PrimaryLanguage: en
            RequestsOpenAccess: true
          NSExtensionPointIdentifier: com.apple.keyboard-service
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).KeyboardViewController
        CFBundleDisplayName: OneBoard
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.translatorkeyboard.app.keyboard
        INFOPLIST_FILE: KeyboardExtension/Resources/Info.plist
        TARGETED_DEVICE_FAMILY: "1"
        CODE_SIGN_ENTITLEMENTS: KeyboardExtension/KeyboardExtension.entitlements
        DEVELOPMENT_TEAM: 3Q2D38NW4X
    entitlements:
      path: KeyboardExtension/KeyboardExtension.entitlements
      properties:
        com.apple.security.application-groups:
          - group.com.translatorkeyboard.shared
        keychain-access-groups:
          - $(AppIdentifierPrefix)group.com.translatorkeyboard.shared
